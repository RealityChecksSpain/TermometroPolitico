name: Leyes nuevas - carga, materias y resúmenes

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

concurrency:
  group: resumenes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  leyes:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LEGISLATURA_ACTIVA_ID: ${{ secrets.LEGISLATURA_ACTIVA_ID }}
      MODELO_IA: ${{ vars.MODELO_IA }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar que estan los secretos
        run: |
          faltan=""
          for v in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY GEMINI_API_KEY LEGISLATURA_ACTIVA_ID; do
            if [ -z "${!v}" ]; then faltan="$faltan $v"; fi
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos del repositorio:$faltan"
            exit 1
          fi

      - name: Cargar iniciativas nuevas del Congreso
        id: iniciativas
        run: node --import tsx scripts/cargar-iniciativas.ts
        timeout-minutes: 15
        continue-on-error: true

      - name: Enlazar votaciones con sus iniciativas
        id: enlazar
        run: node --import tsx scripts/enlazar.ts
        timeout-minutes: 20
        continue-on-error: true

      - name: Dar ficha a las votaciones sin iniciativa (mociones, PNL, tratados, decretos)
        id: huerfanas
        run: node --import tsx scripts/normas-sin-iniciativa.ts --escribir
        timeout-minutes: 15
        continue-on-error: true

      - name: Descargar textos del BOCG
        id: textos
        run: node --import tsx scripts/descargar-textos.ts
        timeout-minutes: 45
        continue-on-error: true

      - name: Asignar materia y colectivos afectados
        id: clasificar
        run: node --import tsx scripts/clasificar.ts
        timeout-minutes: 60
        continue-on-error: true

      - name: Resumir lo que tiene texto
        id: resumir
        run: node --import tsx scripts/resumir.ts
        timeout-minutes: 90
        continue-on-error: true

      - name: Resumir desde el titulo lo que no tiene texto
        id: actas
        run: node --import tsx scripts/resumir-actas.ts
        timeout-minutes: 45
        continue-on-error: true

      - name: Codificar las acciones de las leyes nuevas
        id: codificar
        if: ${{ vars.VERSION_CODIGO_LEY != '' && vars.MODELO_CODIGO_LEY != '' }}
        env:
          MODELO_IA: ${{ vars.MODELO_CODIGO_LEY }}
          VERSION_CODIGO_LEY: ${{ vars.VERSION_CODIGO_LEY }}
        run: node --import tsx scripts/codificar-leyes.ts
        timeout-minutes: 45
        continue-on-error: true

      - name: Avisar si la codificacion esta apagada
        if: ${{ vars.VERSION_CODIGO_LEY == '' || vars.MODELO_CODIGO_LEY == '' }}
        run: echo "::notice::Las leyes nuevas no se codifican porque faltan las variables VERSION_CODIGO_LEY y MODELO_CODIGO_LEY. Sin ellas no salen sus acciones en las tarjetas."

      - name: Refrescar metricas y cache de la web
        id: refrescar
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/refrescar.ts
        timeout-minutes: 15

      - name: Comprobar el resultado
        if: ${{ !cancelled() }}
        run: |
          fallos=""
          for par in \
            "cargar iniciativas=${{ steps.iniciativas.outcome }}" \
            "enlazar=${{ steps.enlazar.outcome }}" \
            "votaciones sin iniciativa=${{ steps.huerfanas.outcome }}" \
            "textos=${{ steps.textos.outcome }}" \
            "materias=${{ steps.clasificar.outcome }}" \
            "resumenes con texto=${{ steps.resumir.outcome }}" \
            "resumenes desde el titulo=${{ steps.actas.outcome }}" \
            "codificacion=${{ steps.codificar.outcome }}" \
            "refresco=${{ steps.refrescar.outcome }}"
          do
            nombre="${par%%=*}"
            resultado="${par##*=}"
            if [ "$resultado" != "success" ] && [ "$resultado" != "skipped" ]; then
              fallos="$fallos, $nombre"
            fi
          done
          if [ -n "$fallos" ]; then
            echo "::error::Ha fallado:${fallos#,}. Los demas pasos se han hecho; abre el paso que falla para ver por que."
            exit 1
          fi
          echo "Todo en orden."